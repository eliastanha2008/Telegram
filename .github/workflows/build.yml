name: APK Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/local/graalvm /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /

      - name: Checkout source with submodules
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/${{ github.repository }}.git .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null

      - name: Tune Gradle for CI runner
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' gradle.properties
          echo 'org.gradle.daemon=false' >> gradle.properties

      - name: Build APK (Afat release, armeabi-v7a)
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
